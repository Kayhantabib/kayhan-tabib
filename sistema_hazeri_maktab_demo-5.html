<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#174c3d">
<title>سیستم حاضری مکاتب افغانستان</title>
<style>
:root{
 --site-primary:#174c3d; --site-on-primary:#ffffff;
 --site-secondary:#e4b85c; --site-on-secondary:#17251f;
 --site-background:#f3f6f4; --site-on-background:#182720;
 --site-font-body:Tahoma,Arial,sans-serif; --site-font-heading:Tahoma,Arial,sans-serif;
 --site-heading-scale:1; --site-spacing-scale:1; --site-radius-scale:1;
 --site-decoration-opacity:1;
 --surface:#ffffff; --muted:#65756c; --line:#dce5df; --soft:#eaf2ed;
}
*{box-sizing:border-box}
body{margin:0;font-family:var(--site-font-body);background:light-dark(#f3f6f4,#101814);color:light-dark(var(--site-on-background),#eef5f0)}
#app{background-color:var(--site-background);color:var(--site-on-background);min-height:100vh;border-radius:0}
header{background:var(--site-primary);color:var(--site-on-primary);padding:22px max(16px,calc((100% - 1120px)/2));border-bottom:5px solid var(--site-secondary)}
header h1{font-size:calc(1.55rem * var(--site-heading-scale));margin:0 0 8px;font-family:var(--site-font-heading)}
header p{margin:0;opacity:.86;font-size:.92rem}
main{max-width:1120px;margin:auto;padding:22px calc(18px * var(--site-spacing-scale)) 48px}
.breadcrumb{display:flex;flex-wrap:wrap;gap:7px;align-items:center;color:var(--muted);font-size:.9rem;margin-bottom:18px}
.breadcrumb button{border:0;background:transparent;color:var(--site-primary);padding:3px;cursor:pointer;font:inherit}
.hero{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h2{font-size:calc(1.35rem * var(--site-heading-scale));margin:0 0 8px}
.sub{color:var(--muted);margin:0;line-height:1.8}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card,.panel{background:var(--surface);border:1px solid var(--line);border-radius:calc(16px * var(--site-radius-scale));padding:18px;box-shadow:0 4px 15px #173f3510}
.card{cursor:pointer;transition:transform .15s,border-color .15s;min-height:120px}
.card:hover{transform:translateY(-2px);border-color:var(--site-primary)}
.card h3{margin:0 0 9px;font-size:1.12rem}
.card p{margin:0;color:var(--muted);font-size:.9rem;line-height:1.7}
.card .count{display:inline-block;margin-top:14px;background:var(--soft);color:var(--site-primary);padding:5px 10px;border-radius:20px;font-size:.82rem}
button,.btn{font-family:inherit;cursor:pointer;border:1px solid var(--line);border-radius:10px;padding:10px 13px;background:#fff;color:#193b2e;font-size:.92rem}
button.primary,.btn.primary{background:var(--site-primary);color:white;border-color:var(--site-primary)}
button.gold{background:var(--site-secondary);border-color:var(--site-secondary);color:#17251f}
button.danger{color:#9e3029}
button:disabled{opacity:.45;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.tabs button.active{background:var(--site-primary);color:white;border-color:var(--site-primary)}
.notice{background:#fff8e6;border:1px solid #efdaa0;color:#6d531b;padding:12px 14px;border-radius:12px;line-height:1.7;margin:14px 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:16px 0}
.stat{padding:14px;background:var(--soft);border-radius:12px}
.stat small{display:block;color:var(--muted);margin-bottom:6px}.stat strong{font-size:1.35rem;color:var(--site-primary)}
table{border-collapse:collapse;width:100%;min-width:680px;background:#fff}
th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:#edf4ef;color:#244b3a}
.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;margin-top:12px}
.person{color:var(--site-primary);font-weight:bold;text-decoration:underline;cursor:pointer}
input,select,textarea{font:inherit;border:1px solid #cbd8cf;border-radius:9px;padding:10px;width:100%;background:#fff;color:#1a2a22}
label{display:block;font-size:.9rem;margin-bottom:6px;color:#405449}
.field{margin-bottom:13px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
textarea{min-height:150px;resize:vertical}
.modal-back{position:fixed;inset:0;background:#09140f99;display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;color:#1a2a22;border-radius:18px;padding:22px;box-shadow:0 20px 80px #0004}
.modal h3{margin-top:0}.modal .actions{margin-top:16px}
.avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;background:#e8eee9;display:grid;place-items:center;font-size:1.8rem}
.locked{display:inline-block;background:#eaf2ed;color:#28553e;padding:5px 9px;border-radius:20px;font-size:.8rem}
footer{border-top:1px solid var(--line);padding:18px;text-align:center;color:var(--muted);font-size:.82rem}
.empty{padding:24px;text-align:center;color:var(--muted)}
@media(max-width:600px){header{padding:18px 16px}main{padding:16px 12px 36px}.hero{align-items:flex-start}button{padding:9px 10px}.panel{padding:13px}}
</style>
</head>
<body>
<div id="app">
<header><h1 id="pageTitle">سیستم حاضری مکاتب افغانستان</h1><p id="pageSubtitle">نمونهٔ نمایشی • مدیریت حاضری، ثبت شاگردان و ترقی تعلم</p></header>
<main>
<nav class="breadcrumb" id="crumbs"></nav>
<section id="view"></section>
</main>
<footer>نسخهٔ نمایشی است؛ رمزها و اطلاعات آزمایشی‌اند و پس از بستن یا تازه‌سازی صفحه از بین می‌روند. اسکنر انگشت واقعی وصل نیست.</footer>
</div>
<div id="modalRoot"></div>
<script>
const DEMO_CODES={province:"1111",district:"2222",village:"3333",school:"4444",admin:"9999",otp:"8888",teacher:"5555",oversight:"7777"};
const provinceNames=["کابل","تخار","بلخ","هرات","قندهار"];
const SCHOOL_GRADES=["صنف اول","صنف دوم","صنف سوم","صنف چهارم","صنف پنجم","صنف ششم","صنف هفتم","صنف هشتم","صنف نهم","صنف دهم","صنف یازدهم","صنف دوازدهم","صنف سیزدهم","صنف چهاردهم"];
const demo={
 provinces:provinceNames.map((name,pi)=>({id:"p"+pi,name,code:DEMO_CODES.province,districts:Array.from({length:4},(_,di)=>({id:`p${pi}d${di}`,name:["مرکز","رستاق","بهارک","چاه‌آب"][di],code:DEMO_CODES.district,villages:Array.from({length:4},(_,vi)=>({id:`p${pi}d${di}v${vi}`,name:["مرکز قریه","قریه بالا","قریه پایین","قریه نو"][vi],code:DEMO_CODES.village,schools:Array.from({length:3},(_,si)=>({id:`p${pi}d${di}v${vi}s${si}`,name:["لیسه کلیچه","مکتب وحدت اسلامی","مکتب معرفت"][si],code:DEMO_CODES.school,students:[],teachers:[],lessons:[],attendance:{},reviews:[]}))}))}))}))
};
function persistReviews(){try{localStorage.setItem("kayhanSchoolReviewNotesV1",JSON.stringify(allSchools().map(({s})=>({schoolId:s.id,reviews:s.reviews||[]}))));}catch(e){}}
function restoreReviews(){try{const saved=JSON.parse(localStorage.getItem("kayhanSchoolReviewNotesV1")||"[]");const map=new Map(saved.map(x=>[x.schoolId,x.reviews||[]]));allSchools().forEach(({s})=>{if(map.has(s.id))s.reviews=map.get(s.id)});}catch(e){}}
let state={level:"home",province:null,district:null,village:null,school:null,tab:"students",selectedPerson:null,editPerson:null,formType:"student",records:{},codes:{...DEMO_CODES},lockedLessons:{},modal:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dayOfYear=()=>{let d=new Date();return Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())-Date.UTC(d.getFullYear(),0,1))/86400000)+1};
const dateString=()=>new Intl.DateTimeFormat("fa-AF",{year:"numeric",month:"long",day:"numeric"}).format(new Date());
function allSchools(){return demo.provinces.flatMap(p=>p.districts.flatMap(d=>d.villages.flatMap(v=>v.schools.map(s=>({p,d,v,s})))));}
restoreReviews();
function currentSchool(){return state.school;}
function heading(){if(state.level==="school")return `سیستم حاضری مکتب (${state.school.name})`;if(state.level==="district")return "سیستم حاضری مکاتب ولسوالی ها";if(state.level==="province")return "سیستم حاضری مکاتب افغانستان";return "سیستم حاضری مکاتب افغانستان";}
function setTitle(){ $("#pageTitle").textContent=heading(); $("#pageSubtitle").textContent=state.level==="province"?`ولایت (${state.province.name}) • نمونهٔ نمایشی`:state.level==="school"?"مدیریت حاضری و امور مکتب": "نمونهٔ نمایشی • مدیریت حاضری، ثبت شاگردان و ترقی تعلم";}
function crumbs(){let a=[["خانه",()=>{state.level="home";state.province=state.district=state.village=state.school=null;render()}]];if(state.province)a.push([state.province.name,()=>{state.level="province";state.district=state.village=state.school=null;render()}]);if(state.district)a.push([state.district.name,()=>{state.level="district";state.village=state.school=null;render()}]);if(state.village)a.push([state.village.name,()=>{state.level="village";state.school=null;render()}]);if(state.school)a.push([state.school.name,()=>{state.level="school";render()}]);$("#crumbs").innerHTML=a.map((x,i)=>`${i?"<span>←</span>":""}<button data-crumb="${i}">${esc(x[0])}</button>`).join("");$("#crumbs").querySelectorAll("button").forEach((b,i)=>b.onclick=a[i][1]);}
function countSchools(p){return p.districts.reduce((n,d)=>n+d.villages.reduce((m,v)=>m+v.schools.length,0),0)}
function cardList(items,kind){return `<div class="grid">${items.map(x=>`<article class="card" data-open="${x.id}"><h3>${esc(x.name)}</h3><p>${kind==="province"?`${x.districts.length} ولسوالی`:kind==="district"?`${x.villages.length} قریه`:kind==="village"?`${x.schools.length} مکتب`:"باز کردن مکتب"}</p><span class="count">باز کردن ←</span><div class="actions" style="margin-top:12px"><button data-action="rename" data-id="${x.id}" data-kind="${kind}">✏ ویرایش نام</button><button data-action="changecode" data-id="${x.id}" data-kind="${kind}">🔑 تغییر رمز</button></div></article>`).join("")}</div><div class="actions" style="margin-top:16px"><button class="primary" data-action="addlevel" data-kind="${kind}">＋ افزودن ${kind==="province"?"ولایت":kind==="district"?"ولسوالی":kind==="village"?"قریه":"مکتب"}</button></div>`}
function homeView(){return `<div class="hero"><div><h2>سیستم حاضری مکاتب افغانستان</h2><p class="sub">برای ورود به هر سطح، کارت مربوط را باز کنید. رمزهای آزمایشی زیر پنجرهٔ رمز نیز نمایش داده می‌شوند.</p></div><button class="gold" data-action="oversight">👁 ورود هیأت ولایتی</button></div><div class="notice">رمزهای آزمایشی: ولایت ۱۱۱۱ • ولسوالی ۲۲۲۲ • قریه ۳۳۳۳ • مکتب ۴۴۴۴</div>${cardList(demo.provinces,"province")}<div class="actions" style="margin-top:18px"><button data-action="settings">⚙ تنظیم رمزهای سیستم</button></div>`}
function levelView(){let items,kind;if(state.level==="province"){items=state.province.districts;kind="district"}else if(state.level==="district"){items=state.district.villages;kind="village"}else{items=state.village.schools;kind="school"}return `<div class="hero"><div><h2>${state.level==="province"?"ولسوالی‌های ولایت":state.level==="district"?"قریه‌های ولسوالی":"مکاتب قریه"} ${esc(state.level==="province"?state.province.name:state.level==="district"?state.district.name:state.village.name)}</h2><p class="sub">برای ورود، کارت را انتخاب کنید.</p></div></div>${cardList(items,kind)}`}
function schoolReviewSection(s){let reviews=(s.reviews||[]).slice().reverse();return `<section class="panel" style="margin-top:18px;border-right:5px solid var(--site-secondary)"><h3>📋 یادداشت‌های قفل‌شدهٔ هیأت ولایتی</h3><p class="sub">این یادداشت‌ها برای مدیران و معلمان مکتب قابل مشاهده است. پس از نهایی‌شدن، در این نمونه دکمهٔ ویرایش ندارد.</p>${reviews.length?reviews.map(r=>`<article class="panel" style="background:var(--soft);margin:12px 0"><div class="actions" style="justify-content:space-between"><b>${esc(r.grade)} — گزارش بازدید</b><span class="locked">🔒 قفل‌شده</span></div><p style="white-space:pre-wrap;line-height:1.9">${esc(r.note)}</p><small>بازدیدکننده: ${esc(r.auditor)} • تاریخ: ${esc(r.date)} • وضعیت: نهایی و غیرقابل ویرایش</small></article>`).join(""):'<p class="empty">هنوز یادداشت نظارتی برای این مکتب ثبت نشده است.</p>'}</section>`}
function reviewForm(id,grade){let found=allSchools().find(x=>x.s.id===id);if(!found)return;let {p,d,v,s}=found;s.reviews=s.reviews||[];modal(`ثبت نتیجهٔ بازدید — ${esc(grade)}`,`<p><b>مکتب:</b> ${esc(s.name)} • <b>ولایت:</b> ${esc(p.name)}</p><div class="field"><label>نام هیأت / مسئول بازدید</label><input id="reviewAuditor" value="هیأت ولایتی ولایت ${esc(p.name)}"></div><div class="field"><label>نتیجهٔ بازدید و یادداشت</label><textarea id="reviewNote" rows="5" placeholder="مثال: صنف اول مکتب معرفت از طرف هیأت ولایتی ولایت ${esc(p.name)} دیدن شد. هیچ مشکلی در این صنف دیده نشد."></textarea></div><p class="notice">پس از نهایی‌سازی، یادداشت قفل می‌شود و از صفحهٔ مدیران و معلمان مکتب قابل دیدن خواهد بود. در نسخهٔ آزمایشی، قفل در سطح رابط برنامه است و امنیت سروری ندارد.</p>`,`<button class="primary" id="finalizeReview">🔒 نهایی‌سازی و قفل</button>`);let btn=$("#modalRoot #finalizeReview");btn.onclick=()=>{let note=$("#modalRoot #reviewNote").value.trim(),auditor=$("#modalRoot #reviewAuditor").value.trim();if(!note||!auditor){alert("نام هیأت و متن نتیجه را تکمیل کنید.");return}s.reviews.push({id:"rev"+Date.now(),grade,note,auditor,date:dateString(),locked:true});persistReviews();$("#modalRoot").innerHTML="";alert("یادداشت نهایی و قفل شد. مدیران و معلمان این مکتب می‌توانند آن را ببینند.");state.level="oversight";render()}}
function people(){return state.tab==="teachers"?state.school.teachers:state.school.students}
function dayKey(){return new Date().toISOString().slice(0,10)}
function isPresent(person){return !!(state.school.attendance[person.id]||{})[attendanceKey(Number(state.attendanceMonth||new Date().getMonth()+1),Math.min(30,new Date().getDate()))]}
function presentCount(person){return monthPresentCount(person,Number(state.attendanceMonth||new Date().getMonth()+1))}
function daysElapsed(){return Math.max(1,dayOfYear())}
function peopleTable(){let list=people(),isTeacher=state.tab==="teachers";return `<div class="stats"><div class="stat"><small>تاریخ امروز</small><strong style="font-size:1rem">${dateString()}</strong></div><div class="stat"><small>تعداد ${isTeacher?"معلمین":"شاگردان"}</small><strong>${list.length}</strong></div><div class="stat"><small>حاضر امروز</small><strong>${list.filter(isPresent).length}</strong></div><div class="stat"><small>غایب امروز</small><strong>${list.filter(p=>!isPresent(p)).length}</strong></div></div><div class="actions"><button class="primary" data-action="scan">☝ اسکن انگشت (آزمایشی)</button><button data-action="addperson">＋ افزودن ${isTeacher?"معلم":"شاگرد"}</button></div><div class="notice">خانهٔ حاضری مستقیماً قابل ویرایش نیست. در این نمونه با اسکن آزمایشی، شخص انتخاب می‌شود و حاضری امروز ثبت می‌گردد.</div><div class="table-wrap"><table><thead><tr><th>نام</th><th>حاضر</th><th>غایب</th><th>وضعیت امروز</th><th>اطلاعات</th></tr></thead><tbody>${list.map(p=>`<tr><td><span class="person" data-person="${p.id}">${esc(p.name)}</span></td><td>${presentCount(p)}</td><td>${Math.max(0,daysElapsed()-presentCount(p))}</td><td>${isPresent(p)?'<span class="locked">✓ حاضر و قفل</span>':'غایب'}</td><td><button data-person="${p.id}">مشاهده / ویرایش</button></td></tr>`).join("")||`<tr><td colspan="5" class="empty">هنوز کسی ثبت نشده است. با «افزودن» شخص آزمایشی اضافه کنید.</td></tr>`}</tbody></table></div><h3 style="margin-top:22px">جدول حاضری ماهانه — ۳۰ روز</h3><p class="sub">تاریخ هر روز بالای خانه نوشته شده است. ثبت فقط با اسکن انگشت آزمایشی انجام می‌شود؛ خانه‌ها دستی قابل تغییر نیستند.</p><div class="field" style="max-width:260px;margin-top:12px"><label>انتخاب ماه</label><select id="attendanceMonth">${Array.from({length:12},(_,i)=>`<option value="${i+1}" ${Number(state.attendanceMonth||new Date().getMonth()+1)===i+1?"selected":""}>ماه ${i+1}</option>`).join("")}</select></div><div class="table-wrap"><table style="min-width:1200px"><thead><tr><th>نام</th>${Array.from({length:30},(_,i)=>`<th style="text-align:center;min-width:58px"><div>روز ${i+1}</div><small style="display:block;color:#52685b;font-weight:normal">${esc(attendanceDateLabel(Number(state.attendanceMonth||new Date().getMonth()+1),i+1))}</small></th>`).join("")}<th>حاضر</th><th>غایب</th></tr></thead><tbody>${list.map(p=>`<tr><td><span class="person" data-person="${p.id}">${esc(p.name)}</span></td>${Array.from({length:30},(_,i)=>{let k=attendanceKey(Number(state.attendanceMonth||new Date().getMonth()+1),i+1);return `<td style="text-align:center">${(state.school.attendance[p.id]||{})[k]?'✓':'—'}</td>`}).join("")}<td>${monthPresentCount(p,Number(state.attendanceMonth||new Date().getMonth()+1))}</td><td>${30-monthPresentCount(p,Number(state.attendanceMonth||new Date().getMonth()+1))}</td></tr>`).join("")||`<tr><td colspan="32" class="empty">هنوز کسی ثبت نشده است.</td></tr>`}</tbody></table></div>`}
function attendanceKey(month,day){return `school-calendar-${month}-${day}`}
function attendanceDateLabel(month,day){const now=new Date();if(month===now.getMonth()+1 && day===now.getDate())return "امروز";return `${day}/${month}`}
function monthPresentCount(person,month){return Array.from({length:30},(_,i)=>(state.school.attendance[person.id]||{})[attendanceKey(month,i+1)]).filter(Boolean).length}

function oversightClassReport(id,grade){let found=allSchools().find(x=>x.s.id===id);if(!found)return;let {p,d,v,s}=found,month=Number(state.attendanceMonth||new Date().getMonth()+1),students=s.students.filter(x=>x.grade===grade),lessons=s.lessons.filter(l=>l.grade===grade),teacherNames=[...new Set(lessons.map(l=>l.teacher).filter(Boolean))];modal(`گزارش ${esc(grade)} — ${esc(s.name)}`,`<p><b>موقعیت:</b> ${esc(p.name)} ← ${esc(d.name)} ← ${esc(v.name)} ← ${esc(s.name)}</p><div class="stats"><div class="stat"><small>شاگردان این صنف</small><strong>${students.length}</strong></div><div class="stat"><small>گزارش‌های تدریس</small><strong>${lessons.length}</strong></div><div class="stat"><small>روز گزارش</small><strong>${month}</strong></div></div><h4>حاضری شاگردان — ماه ${month}</h4><div class="table-wrap"><table><thead><tr><th>نام شاگرد</th><th>روزهای حاضر</th><th>روزهای ثبت‌نشده</th></tr></thead><tbody>${students.map(x=>{let n=monthPresentCountForSchool(s,x,month);return `<tr><td>${esc(x.name)}</td><td>${n}</td><td>${30-n}</td></tr>`}).join("")||`<tr><td colspan="3">برای ${esc(grade)} هنوز شاگردی ثبت نشده است.</td></tr>`}</tbody></table></div><h4 style="margin-top:16px">حاضری و تدریس معلم</h4><p>معلمانی که برای این صنف درس ثبت کرده‌اند: ${teacherNames.map(esc).join("، ")||"هنوز معلمی در گزارش تدریس این صنف ثبت نشده است"}</p><h4>پیشرفت تعلیم / درس‌های این صنف</h4>${lessons.length?lessons.slice().reverse().map(l=>`<div class="panel"><b>${esc(l.date||"بدون تاریخ")} — ${esc(l.topic||"بدون عنوان")}</b><p>معلم: ${esc(l.teacher||"—")} • کتاب/مضمون: ${esc(l.book||"—")}</p><p>${esc(l.details||"تفصیلات ثبت نشده")}</p><small>${l.locked?"نهایی‌شده":"ذخیره‌شده"}</small></div>`).join(""):'<p class="empty">هنوز درس یا گزارش پیشرفت برای این صنف ثبت نشده است.</p>'}`,`<button class="primary" id="addReview">✍ ثبت نتیجهٔ بازدید و قفل</button><button id="closeReport">بستن گزارش</button>`);let add=$("#modalRoot #addReview");if(add)add.onclick=()=>reviewForm(id,grade);let close=$("#modalRoot function render(){setTitle();crumbs();let html=state.level==="home"?homeView():state.level==="oversight"?oversightView():state.level==="school"?schoolView():levelView();$("#view").innerHTML=html;wire();}
function wire(){
 $("#view").querySelectorAll("[data-open]").forEach(el=>el.onclick=e=>{if(e.target.closest("button"))return;let id=el.dataset.open;if(state.level==="home"){askCode("province",()=>{state.province=demo.provinces.find(x=>x.id===id);state.level="province";render()})}else if(state.level==="province"){askCode("district",()=>{state.district=state.province.districts.find(x=>x.id===id);state.level="district";render()})}else if(state.level==="district"){askCode("village",()=>{state.village=state.district.villages.find(x=>x.id===id);state.level="village";render()})}else{askCode("school",()=>{state.school=state.village.schools.find(x=>x.id===id);state.level="school";state.tab="students";state.selectedPerson=null;render()})}});
 $("#view").querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>action(b.dataset.action,b.dataset));
 $("#view").querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{state.tab=b.dataset.tab;state.selectedPerson=null;render()});
 $("#view").querySelectorAll("[data-formtype]").forEach(b=>b.onclick=()=>{state.formType=b.dataset.formtype;render()});
 $("#view").querySelectorAll("[data-person]").forEach(b=>b.onclick=()=>personAction(b.dataset.person));
 const monthSelect=$("#attendanceMonth");if(monthSelect)monthSelect.onchange=()=>{state.attendanceMonth=Number(monthSelect.value);render()};
 const oversightProvince=$("#oversightProvince");if(oversightProvince)oversightProvince.onchange=()=>{state.oversightProvince=oversightProvince.value;state.oversightDistrict="all";state.oversightVillage="all";state.oversightSchool="all";render()};
 const oversightDistrict=$("#oversightDistrict");if(oversightDistrict)oversightDistrict.onchange=()=>{state.oversightDistrict=oversightDistrict.value;state.oversightVillage="all";state.oversightSchool="all";render()};
 const oversightVillage=$("#oversightVillage");if(oversightVillage)oversightVillage.onchange=()=>{state.oversightVillage=oversightVillage.value;state.oversightSchool="all";render()};
 const oversightSchool=$("#oversightSchool");if(oversightSchool)oversightSchool.onchange=()=>{state.oversightSchool=oversightSchool.value;render()};
 const oversightGrade=$("#oversightGrade");if(oversightGrade)oversightGrade.onchange=()=>{state.oversightGrade=oversightGrade.value;render()};
 const oversightMonth=$("#oversightMonth");if(oversightMonth)oversightMonth.onchange=()=>{state.attendanceMonth=Number(oversightMonth.value);render()};
 $("#view").querySelectorAll("[data-report-school]").forEach(b=>b.onclick=()=>oversightSchoolReport(b.dataset.reportSchool));

function modal(title,body,buttons=""){ $("#modalRoot").innerHTML=`<div class="modal-back"><div class="modal"><h3>${title}</h3>${body}<div class="actions">${buttons}<button data-close>بستن</button></div></div></div>`;$("#modalRoot").querySelector("[data-close]").onclick=()=>$("#modalRoot").innerHTML="";$("#modalRoot").querySelector(".modal-back").onclick=e=>{if(e.target.classList.contains("modal-back"))$("#modalRoot").innerHTML=""};}
function askCode(type,success,opts={}){let code=state.codes[type]||DEMO_CODES[type]||"9999",label={province:"ولایت",district:"ولسوالی",village:"قریه",school:"مکتب",admin:"مدیر",otp:"رمز یک‌بارمصرف ویرایش",teacher:"معلم",oversight:"هیأت ولایتی"}[type]||type;modal(`رمز ${label}`,`<p>رمز آزمایشی: <b>${esc(code)}</b></p><div class="field"><label>رمز ورود</label><input id="codeInput" inputmode="numeric" type="password" placeholder="رمز را وارد کنید"></div><p id="codeErr" style="color:#a22"></p>`,`<button class="primary" id="confirmCode">تأیید</button>`);$("#modalRoot").querySelector("#confirmCode").onclick=()=>{if($("#codeInput").value===code){$("#modalRoot").innerHTML="";success()}else $("#codeErr").textContent="رمز نادرست است. رمز آزمایشی بالای فورم نوشته شده است."};}
function action(a,d){if(a==="home"){state.level="home";state.province=state.district=state.village=state.school=null;render()}
else if(a==="oversight")askCode("oversight",()=>{state.level="oversight";render()});
else if(a==="settings")askCode("admin",()=>systemSettings());
else if(a==="scan")scanModal();
else if(a==="addperson")askCode("admin",()=>{state.formType=state.tab==="teachers"?"teacher":"student";registerForm()});
else if(a==="addteacher")askCode("admin",()=>{state.formType="teacher";registerForm()});
else if(a==="registerUnlock")askCode("admin",()=>registerForm());
else if(a==="savelesson")saveLesson(false);
else if(a==="locklesson")saveLesson(true);
else if(a==="cancelLesson"){state.selectedPerson=null;render()}
else if(a==="renameSchool")askCode("admin",()=>renameForm(state.school,"مکتب"));
else if(a==="changeSchoolCode")changeCode(state.school,"school");
else if(a==="addlevel")askCode("admin",()=>addLevel(d.kind));
else if(a==="rename")askCode("admin",()=>renameTarget(d.id,d.kind));
else if(a==="changecode")changeCode(findTarget(d.id,d.kind),d.kind);
}
function scanModal(){let list=people(),month=Number(state.attendanceMonth||new Date().getMonth()+1),today=Math.min(30,new Date().getDate());modal("اسکن انگشت (آزمایشی)",`<p>این دکمه به اسکنر واقعی وصل نیست. پس از انتخاب شخص، حاضری همان روز ثبت و خانه قفل می‌شود.</p><div class="field"><label>انتخاب شخص</label><select id="scanPerson">${list.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select></div><div class="field"><label>روز حاضری</label><select id="scanDay">${Array.from({length:30},(_,i)=>`<option value="${i+1}" ${(month===new Date().getMonth()+1&&i+1===today)?"selected":""}>روز ${i+1} — تاریخ ${i+1}/${month}${month===new Date().getMonth()+1&&i+1===today?" (امروز)":""}</option>`).join("")}</select></div><p>تاریخ امروز سیستم: ${dateString()}</p>`,`<button class="primary" id="doScan">ثبت اثر انگشت آزمایشی</button>`);$("#modalRoot").querySelector("#doScan").onclick=()=>{let id=$("#scanPerson").value,day=Number($("#scanDay").value);if(!id){alert("ابتدا شخص را ثبت کنید.");return}state.school.attendance[id]=state.school.attendance[id]||{};state.school.attendance[id][attendanceKey(month,day)]=true;state.attendanceMonth=month;$("#modalRoot").innerHTML="";render()}}
function registerForm(existing=null){let isT=state.formType==="teacher",p=existing||{};modal(`${existing?"ویرایش":"ثبت"} ${isT?"معلم":"شاگرد"}`,`<div class="form-grid"><div class="field"><label>نام</label><input id="fName" value="${esc(p.name||"")}"></div><div class="field"><label>نام پدر</label><input id="fFather" value="${esc(p.father||"")}" ${isT?"disabled":""}></div><div class="field"><label>تذکره</label><input id="fIdcard" value="${esc(p.idcard||"")}"></div><div class="field"><label>تلفن ${isT?"معلم":"پدر"}</label><input id="fPhone" value="${esc(p.phone||"")}"></div>${isT?`<div class="field"><label>مضمون</label><input id="fSubject" value="${esc(p.subject||"")}"></div>`:`<div class="field"><label>صنف</label><select id="fGrade">${SCHOOL_GRADES.map(g=>`<option value="${g}" ${p.grade===g?"selected":""}>${g}</option>`).join("")}</select></div>`}<div class="field"><label>عکس</label><input id="fPhoto" type="file" accept="image/*"><small>عکس فقط در همین نمونهٔ موقت می‌ماند.</small></div></div>`,`<button class="primary" id="savePerson">ثبت و قفل اطلاعات</button>`);$("#modalRoot").querySelector("#savePerson").onclick=()=>{let name=$("#fName").value.trim();if(!name){alert("نام را وارد کنید.");return}let item={id:p.id||"person"+Date.now(),name,father:$("#fFather").value,idcard:$("#fIdcard").value,phone:$("#fPhone").value,grade:$("#fGrade")?.value||"",subject:$("#fSubject")?.value||"",locked:true};let file=$("#fPhoto").files[0];const finish=()=>{let arr=isT?state.school.teachers:state.school.students;if(existing){Object.assign(existing,item)}else arr.push(item);$("#modalRoot").innerHTML="";state.tab=isT?"teachers":"students";state.selectedPerson=null;render()};if(file){let r=new FileReader();r.onload=()=>{item.photo=r.result;finish()};r.readAsDataURL(file)}else{item.photo=p.photo||"";finish()}}}
function personAction(id){let p=[...state.school.students,...state.school.teachers].find(x=>x.id===id);if(!p)return;modal("اطلاعات شخص",`<div style="display:flex;gap:14px;align-items:center;margin-bottom:14px">${p.photo?`<img class="avatar" src="${p.photo}">`:'<div class="avatar">👤</div>'}<div><h3 style="margin:0 0 5px">${esc(p.name)}</h3><span class="locked">${p.locked?"قفل اطلاعات":"قابل ویرایش"}</span></div></div><p>نام پدر: ${esc(p.father||"—")}</p><p>تذکره: ${esc(p.idcard||"—")}</p><p>تلفن: ${esc(p.phone||"—")}</p><p>صنف / مضمون: ${esc(p.grade||p.subject||"—")}</p><p>مجموع روزهای حاضر: ${presentCount(p)}</p>`,`<button class="primary" id="editP">ویرایش (رمز مدیر)</button>`);$("#modalRoot").querySelector("#editP").onclick=()=>{askCode("otp",()=>{state.formType=state.school.teachers.includes(p)?"teacher":"student";registerForm(p)})}}
function saveLesson(locked){let topic=$("#lessonTopic")?.value.trim();if(!topic){alert("عنوان درس را وارد کنید.");return}state.school.lessons.push({id:"l"+Date.now(),teacher:state.selectedPerson.name,date:$("#lessonDate").value,grade:$("#lessonGrade").value,book:$("#lessonBook").value,topic,details:$("#lessonDetails").value,locked});if(locked){state.selectedPerson=null}render()}
function systemSettings(){modal("تنظیم رمزهای سیستم",`<p class="sub">رمز فعلی هر بخش را وارد کنید تا تغییر یابد. خانهٔ خالی یعنی بدون تغییر.</p>${["admin","otp","teacher","oversight"].map(k=>`<div class="field"><label>${{admin:"رمز مدیر",otp:"رمز ویرایش یک‌بارمصرف",teacher:"رمز معلم",oversight:"رمز هیأت ولایتی"}[k]}</label><input id="sys_${k}" placeholder="رمز تازه (حداقل ۴ رقم)"></div>`).join("")}`,`<button class="primary" id="saveCodes">ذخیرهٔ رمزها</button>`);$("#modalRoot").querySelector("#saveCodes").onclick=()=>{for(let k of ["admin","otp","teacher","oversight"]){let v=$("#sys_"+k).value.trim();if(v&&v.length<4){alert("رمز باید حداقل ۴ رقم باشد.");return}if(v)state.codes[k]=v}$("#modalRoot").innerHTML="";alert("رمزها در همین نمونه تا بسته شدن صفحه تغییر یافتند.")}}
function findTarget(id,kind){let list=kind==="province"?demo.provinces:kind==="district"?demo.provinces.flatMap(p=>p.districts):kind==="village"?demo.provinces.flatMap(p=>p.districts.flatMap(d=>d.villages)):allSchools().map(x=>x.s);return list.find(x=>x.id===id)}
function renameTarget(id,kind){let target=findTarget(id,kind);renameForm(target,kind==="province"?"ولایت":kind==="district"?"ولسوالی":kind==="village"?"قریه":"مکتب")}
function renameForm(target,label){modal(`ویرایش نام ${label}`,`<div class="field"><label>نام جدید</label><input id="newName" value="${esc(target.name)}"></div>`,`<button class="primary" id="saveName">ذخیره</button>`);$("#modalRoot").querySelector("#saveName").onclick=()=>{let n=$("#newName").value.trim();if(!n)return;target.name=n;$("#modalRoot").innerHTML="";render()}}
function changeCode(target,kind){askCode("admin",()=>{modal("تغییر رمز",`<p>رمز فعلی آزمایشی: ${esc(target.code||DEMO_CODES[kind]||"۴۴۴۴")}</p><div class="field"><label>رمز جدید (حداقل ۴ رقم)</label><input id="newCode" inputmode="numeric"></div>`,`<button class="primary" id="saveCode">ذخیره</button>`);$("#modalRoot").querySelector("#saveCode").onclick=()=>{let c=$("#newCode").value.trim();if(c.length<4){alert("رمز حداقل ۴ رقم باشد.");return}target.code=c;$("#modalRoot").innerHTML="";alert("رمز تغییر کرد؛ فقط در همین نمونه موقت است.")}})}
function addLevel(kind){let labels={province:"ولایت",district:"ولسوالی",village:"قریه",school:"مکتب"};modal(`افزودن ${labels[kind]}`,`<div class="field"><label>نام ${labels[kind]}</label><input id="addName"></div><div class="field"><label>رمز تازه (حداقل ۴ رقم)</label><input id="addCode" inputmode="numeric"></div>`,`<button class="primary" id="saveNew">افزودن</button>`);$("#modalRoot").querySelector("#saveNew").onclick=()=>{let name=$("#addName").value.trim(),code=$("#addCode").value.trim();if(!name||code.length<4){alert("نام و رمز حداقل ۴ رقمی لازم است.");return}let id="new"+Date.now();if(kind==="province")demo.provinces.push({id,name,code,districts:[]});else if(kind==="district")state.province.districts.push({id,name,code,villages:[]});else if(kind==="village")state.district.villages.push({id,name,code,schools:[]});else state.village.schools.push({id,name,code,students:[],teachers:[],lessons:[],attendance:{},reviews:[]});$("#modalRoot").innerHTML="";render()}}
render();
</script>
</body>
</html>
